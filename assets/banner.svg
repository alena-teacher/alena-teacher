<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Терехова Елена Викторовна — репетитор по математике">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A3AFF"/>
      <stop offset="50%" stop-color="#7B2FF7"/>
      <stop offset="100%" stop-color="#1F8AE0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <circle cx="1080" cy="40" r="230" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="120" cy="320" r="190" fill="#FFFFFF" opacity="0.05"/>
  <rect width="1200" height="340" fill="url(#shine)"/>

  <g fill="#FFFFFF" opacity="0.13" font-family="Georgia, 'Times New Roman', serif">
    <text x="60" y="120" font-size="86">&#8721;</text>
    <text x="1040" y="120" font-size="86">&#960;</text>
    <text x="150" y="300" font-size="64">&#8730;x</text>
    <text x="960" y="300" font-size="64">x&#178;</text>
    <text x="600" y="70" font-size="44" text-anchor="middle">sin&#178;&#945; + cos&#178;&#945; = 1</text>
    <text x="380" y="330" font-size="40" text-anchor="middle">&#8747; f(x) dx</text>
    <text x="860" y="330" font-size="40" text-anchor="middle">a&#178; + b&#178; = c&#178;</text>
  </g>

  <text x="600" y="150" text-anchor="middle" fill="#FFFFFF" font-family="'Segoe UI', Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="1">
    Терехова Елена Викторовна
  </text>

  <text x="600" y="205" text-anchor="middle" fill="#E8E4FF" font-family="'Segoe UI', Arial, sans-serif" font-size="30" letter-spacing="6">
    РЕПЕТИТОР ПО МАТЕМАТИКЕ
  </text>

  <g font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#FFFFFF">
    <rect x="300" y="240" width="160" height="44" rx="22" fill="#FFFFFF" opacity="0.18"/>
    <text x="380" y="269" text-anchor="middle">ОГЭ</text>

    <rect x="480" y="240" width="240" height="44" rx="22" fill="#FFFFFF" opacity="0.18"/>
    <text x="600" y="269" text-anchor="middle">ЕГЭ база и профиль</text>

    <rect x="740" y="240" width="180" height="44" rx="22" fill="#FFFFFF" opacity="0.18"/>
    <text x="830" y="269" text-anchor="middle">1&#8211;11 класс</text>
  </g>
</svg>
